[workspace]
name = "ntu-thesis-template"
version = "0.1.0"
description = "Reproducible, rootless build environment for the NTU thesis template"
channels = ["conda-forge"]
# win-arm64 is left out: conda-forge ships neither perl nor fontconfig for it,
# and uharfbuzz and unicodedataplus have never published a wheel for it either.
#
# linux-aarch64 is left out too: every platform's plain TinyTeX build (the
# unqualified "TinyTeX-v*" asset pytinytex looks for) ships as .tar.gz/.tgz/
# .zip except aarch64's, which TinyTeX has only ever published as .tar.xz
# (linux-x86_64 gets a .tar.xz release too, but its .tar.gz one is what
# pytinytex actually uses -- aarch64 has no such fallback). pytinytex 0.5.1
# can neither find a .tar.xz this way (its URL regex only matches
# tar.gz/tgz/zip) nor extract one (its extractor only opens gzip tarballs) --
# confirmed by actually running the build on an arm64 Linux CI runner.
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# Only what pip cannot install stays here: the interpreter itself, and the
# system tools latexmk (Perl) and fc-cache shell out to. Everything else goes
# through PyPI.
python = "3.12.*"
perl = "5.*"
fontconfig = ">=2.14,<3"
ca-certificates = "*"

[pypi-dependencies]
pytinytex = "==0.5.*"
pygments = "==2.19.*"
pymupdf = ">=1.28.0,<2"
requests = ">=2.32,<3"
openpyxl = ">=3.1,<4"
matplotlib = ">=3.8,<4"
fonttools = ">=4.50,<5"
uharfbuzz = ">=0.56,<1"
numpy = ">=1.26,<3"
# The Vertical_Orientation property, and the \X that matches a grapheme.
unicodedataplus = ">=16.0"
regex = ">=2024.0"

# unicodedataplus has no osx-64 wheel at Python 3.12 (its last x86_64 macOS
# build was for 3.11) and none at all from 16.0 on (macOS wheels there are
# arm64-only). A conda-forge compiler could build its sdist instead, but
# that only provides linker/compiler tooling, not Apple's SDK headers --
# conda-forge doesn't redistribute those, so it still needs Xcode's Command
# Line Tools on the machine, which isn't guaranteed and isn't sudo-free.
# Pinning osx-64 to the last Python/unicodedataplus pair with a real wheel
# keeps this platform wheel-only like the rest.
[target.osx-64.dependencies]
python = "3.11.*"

[target.osx-64.pypi-dependencies]
unicodedataplus = ">=15.1,<16"

[tasks]
setup = { cmd = "python scripts/tex_toolchain.py setup", description = "Install rootless TinyTeX and all thesis TeX packages" }
doctor = { cmd = "python scripts/tex_toolchain.py doctor", description = "Check the rootless TinyTeX installation" }
build = { cmd = "python scripts/tex_toolchain.py build", depends-on = ["setup"], description = "Build main.pdf with XeLaTeX, Biber, and minted" }
clean = { cmd = "python scripts/tex_toolchain.py clean", description = "Remove LaTeX build artifacts" }
cover = { cmd = "python scripts/extract_cover.py", description = "Write main-cover.pdf: page 1 of main.pdf alone, stripped of the document-wide objects a cover does not need" }
protect = { cmd = "python scripts/protect_pdf.py", description = "Write main-protected.pdf: readable by anyone, editing and copying locked behind an owner password" }
spine = { cmd = "python scripts/make_spine.py", description = "Write the spine artwork (書側) as ODT and PDF, in both 平裝 and 精裝 widths" }
units = { cmd = "python scripts/fetch_academic_units.py", description = "Refresh ntu-academic-units.tex from NTU's published list of academic units" }
figures = { cmd = "python scripts/make_example_figures.py", description = "Regenerate the example plots in figures/ (the PDFs are committed; this is not part of build)" }
